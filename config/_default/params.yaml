# ══════════════════════════════════════════════════════════════════════════════
# HUGOBLOX CONFIGURATION - 해아림한의원 인천부평점
# ══════════════════════════════════════════════════════════════════════════════
hugoblox:
  schema: "2.0"

  # ────────────────────────────────────────────────────────────────────────────
  # IDENTITY
  # ────────────────────────────────────────────────────────────────────────────
  identity:
    name: "해아림한의원 인천부평점"
    organization: "해아림한의원 인천부평점"
    type: local_business
    tagline: "마음과 몸의 불균형을 세심하게 다스리는 1:1 맞춤 한방 치료"
    description: "인천 부평역 위치 (인천/부천 커버). 공황장애, 불면증, 자율신경실조증, 미주신경실신, 어지럼증, 다한증, 대인기피증, 틱장애, ADHD 1:1 맞춤 한방 치료. 권형근 원장 직접 진료."
    social:
      blog: "https://blog.naver.com/s72x6o8cv"
      kakao: "https://open.kakao.com/o/sgbnTRJi"
      naver_booking: "https://booking.naver.com/booking/13/bizes/934695"

  # ────────────────────────────────────────────────────────────────────────────
  # THEME & COLORS (Lia Korean Medicine Clinic Inspired)
  # ────────────────────────────────────────────────────────────────────────────
  theme:
    mode: light # light | dark | system
    pack: "default"
    colors:
      primary: "#2F5D50"
      secondary: "#EAF3EF"
      neutral: "#FAF8F3"

  # ────────────────────────────────────────────────────────────────────────────
  # TYPOGRAPHY & LAYOUT
  # ────────────────────────────────────────────────────────────────────────────
  typography:
    pack: "system"

  layout:
    radius: "lg" # none | sm | md | lg | full
    spacing: "spacious"
    avatar_shape: rounded

  # ────────────────────────────────────────────────────────────────────────────
  # HEADER
  # ────────────────────────────────────────────────────────────────────────────
  header:
    enable: true
    style: navbar
    sticky: true
    align: center
    search: false
    theme_toggle: true
    cta:
      enable: true
      text: "빠른 상담 예약"
      url: "/consultation/"

  # ────────────────────────────────────────────────────────────────────────────
  # FOOTER
  # ────────────────────────────────────────────────────────────────────────────
  footer:
    style: minimal

  # ────────────────────────────────────────────────────────────────────────────
  # COPYRIGHT & LEGAL
  # ────────────────────────────────────────────────────────────────────────────
  copyright:
    notice: "© {year} 해아림한의원 인천부평점. All rights reserved. | 대표원장: 권형근 | 전화: 032-719-3472"

  # ────────────────────────────────────────────────────────────────────────────
  # CONTENT
  # ────────────────────────────────────────────────────────────────────────────
  content:
    math:
      enable: false
    toc:
      enable: true
    reading_time:
      enable: false

  # ────────────────────────────────────────────────────────────────────────────
  # LOCALE
  # ────────────────────────────────────────────────────────────────────────────
  locale:
    date_format: "2006년 01월 02일"
    time_format: "15:04"
